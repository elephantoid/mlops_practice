[project]
name = "riskwatch"
version = "0.1.0"
description = "Credit-risk and fraud-detection MLOps platform with a full training-to-monitoring loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Data & validation
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=16.0",
    # Data acquisition -- both tracks source through one Kaggle CLI idiom.
    # Home Credit is a competition (token + browser rule acceptance); ULB
    # creditcard is a dataset (token only). OpenML fallbacks live in code.
    "kaggle>=1.6",
    # ML
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    # Experiment tracking
    "mlflow>=2.14",
    # Serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "prometheus-client>=0.20",
    # Monitoring
    "evidently>=0.4",
    # Cloud
    "google-cloud-storage>=2.17",
    # Utils
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "annotated-types>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["TID251"]

# Which MLflow backend a call reaches must not depend on what the process configured earlier
# (4c4384c, 54cbf98). src/models/registry.py is the one place allowed to touch either.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mlflow.MlflowClient".msg = "use src.models.registry.registry_client(); a bare client reads whatever backend the process last set"
"mlflow.client.MlflowClient".msg = "use src.models.registry.registry_client(); a bare client reads whatever backend the process last set"
"mlflow.tracking.MlflowClient".msg = "use src.models.registry.registry_client(); a bare client reads whatever backend the process last set"
"mlflow.tracking.client.MlflowClient".msg = "use src.models.registry.registry_client(); a bare client reads whatever backend the process last set"
"mlflow.set_tracking_uri".msg = "use src.models.registry.configure_tracking()"
"mlflow.tracking.set_tracking_uri".msg = "use src.models.registry.configure_tracking()"

[tool.ruff.lint.per-file-ignores]
"src/models/registry.py" = ["TID251"]
