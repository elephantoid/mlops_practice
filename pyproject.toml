[project]
name = "riskwatch"
version = "0.1.0"
description = "Credit-risk and fraud-detection MLOps platform with a full training-to-monitoring loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Data & validation
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=16.0",
    # Data acquisition -- both tracks source through one Kaggle CLI idiom.
    # Home Credit is a competition (token + browser rule acceptance); ULB
    # creditcard is a dataset (token only). OpenML fallbacks live in code.
    "kaggle>=1.6",
    # ML
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.45",
    # Experiment tracking
    "mlflow>=2.14",
    # Serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "prometheus-client>=0.20",
    # Monitoring
    "evidently>=0.4",
    # Cloud
    "google-cloud-storage>=2.17",
    # Utils
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
