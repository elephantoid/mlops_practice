# The hosted evidence plane, once a day: read yesterday's prediction log from the GCS sink, append
# a PSI row per track to the `evidence` branch, then send today's generated traffic.
#
# Runs with no data/ and no key. The token comes from Workload Identity Federation, whose
# provider admits only this repository's main branch (ops/evidence/setup.sh), and grants read on
# the evidence bucket and nothing else.
#
# Order matters. The alert is judged in the LAST step: a job that failed on the alert first would
# skip the commit and the traffic, and tomorrow would find an empty day. The commit and the
# traffic run whatever happened before them.
#
# The rows go to the orphan `evidence` branch, not main: main takes changes through a PR with
# required checks, and a bot pushing to it daily would be the one exception to that.

name: evidence

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to read, YYYY-MM-DD (default: yesterday)"
        required: false
        default: ""
      traffic:
        description: "Send today's generated traffic"
        type: boolean
        default: true

# One run at a time: two runs pushing to `evidence` together would reject the second push.
concurrency:
  group: evidence
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  RISKWATCH_EVIDENCE_BUCKET: riskwatch-evidence-46336906432
  DATE: ${{ inputs.date }}

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence
          path: evidence
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.12" # the uv that wrote uv.lock; unpinned it floats to latest
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: project-e9695c4a-c0d1-4e50-84f
          workload_identity_provider: projects/46336906432/locations/global/workloadIdentityPools/github/providers/github-actions

      - name: Read the day's log and write its PSI rows
        run: uv run python -m src.monitoring.daily ${DATE:+--date "$DATE"} --out evidence/reports/psi_daily.jsonl

      - name: Commit the rows
        if: always()
        working-directory: evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/psi_daily.jsonl
          git diff --cached --quiet || git commit -m "psi: ${DATE:-$(date -u -d yesterday +%F)} (run $GITHUB_RUN_ID)"
          git push

      - name: Send today's traffic
        if: always() && (github.event_name == 'schedule' || inputs.traffic)
        run: uv run python -m src.monitoring.traffic

      - name: Fail on the day's alerts
        if: always()
        run: uv run python -m src.monitoring.daily ${DATE:+--date "$DATE"} --check evidence/reports/psi_daily.jsonl
