repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Formatting hygiene
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]

      # Parseability of things CI and Docker Compose depend on
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast

      # Safety
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: forbid-submodules

      # Python correctness
      - id: debug-statements
      - id: check-docstring-first
      # macOS is case-insensitive but Cloud Run and CI images are not: a pair of
      # filenames differing only in case commits fine here and breaks the build there.
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # The repo is public and Milestone 3 introduces a GCP service-account key.
  # Scans staged content for credentials before they can reach a push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # notebooks/ab_analysis.ipynb (Milestone 6) runs against real customer rows.
  # Stripping outputs keeps churn data out of a public repo and makes diffs readable.
  - repo: https://github.com/kynan/nbstripout
    rev: "0.9.1"
    hooks:
      - id: nbstripout

  # uv.lock is committed deliberately. Editing pyproject.toml without relocking would
  # break the blueprint's reproducibility bar: same checkout, same command, same artifact.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock
