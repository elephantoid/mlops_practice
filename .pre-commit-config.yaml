repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Formatting hygiene
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]

      # Parseability of things CI and Docker Compose depend on
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # devcontainer.json is JSONC by specification -- VS Code parses comments there, and
        # this repo puts its rationale in comments. check-json is a strict JSON parser, so
        # it would reject a valid file. Excluded rather than stripping the reasoning out.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-ast

      # Safety
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: forbid-submodules

      # Python correctness
      - id: debug-statements
      - id: check-docstring-first
      # macOS is case-insensitive but Cloud Run and CI images are not: a pair of
      # filenames differing only in case commits fine here and breaks the build there.
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # The repo is public and Milestone 3 introduces a GCP service-account key.
  # Scans staged content for credentials before they can reach a push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # notebooks/ab_analysis.ipynb (Milestone 6) runs against real customer rows.
  # Stripping outputs keeps churn data out of a public repo and makes diffs readable.
  - repo: https://github.com/kynan/nbstripout
    rev: "0.9.1"
    hooks:
      - id: nbstripout

  # uv.lock is committed deliberately. Editing pyproject.toml without relocking would
  # break the blueprint's reproducibility bar: same checkout, same command, same artifact.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock

  # This repo's documentation failed by pointing at things that were not there --
  # CONTEXT.md, docs/adr/, ../blueprint/track-e2e/, docs/agents/domain.md -- four dangling
  # references, none of which announced itself. Only the index documents are checked.
  # AGENTS.md is exempt: it is the plan, so naming a file that does not exist yet is its
  # job. Paths git ignores pass, because data/ and mlruns/ are absent from every clone.
  - repo: local
    hooks:
      - id: doc-references
        name: reject dangling references in index docs
        # `uv run` rather than a bare python3: this repo pins 3.12 and forbids any other
        # package manager, so the hook should not depend on whatever interpreter happens
        # to be first on PATH.
        entry: uv run python scripts/check_doc_references.py
        language: system
        files: ^(CLAUDE\.md|STATUS\.md|\.claude/rules/.*\.md)$
