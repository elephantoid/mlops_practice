# Registry-backed configuration, in contrast to `docker run` which uses the baked-in model.
#
#   uv run python -m src.models.export
#   docker compose up --build
#
# The api service here loads from the MLflow registry rather than /app/model, which is the
# configuration Milestone 4's Airflow retraining loop needs: a newly promoted model version
# is picked up on restart with no image rebuild.

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination ${PWD}/mlruns
    environment:
      # MLflow 3.x rejects any Host header outside the localhost variants as a suspected
      # DNS-rebinding attack. On a compose network the API reaches this service as
      # "mlflow:5000", so that name must be allow-listed or every /api/2.0 call 403s.
      # /health is exempt from the check, which is why the healthcheck passes regardless
      # and the failure only shows up once the API tries to resolve the model.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      # Bind-mounted rather than a named volume: a fresh MLflow container has an empty
      # registry, so models:/riskwatch_credit@production would not resolve. This reuses the
      # registry that `uv run python -m src.models.train` populated on the host.
      - ./mlflow.db:/mlflow/mlflow.db
      # Mounted at its own host path, not a tidy /mlflow/mlruns. MLflow records an
      # ABSOLUTE artifact_location in the database at training time, so the directory has
      # to appear inside the container at exactly the path the DB remembers or artifact
      # resolution fails with "No such artifact: ''". ${PWD} keeps that machine-agnostic
      # as long as compose runs from the repo root that trained the model.
      - ./mlruns:${PWD}/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      args:
        MODEL_VERSION: "compose"
    ports:
      - "8000:8000"
    volumes:
      # The API reads model artifacts straight off the filesystem, not through the
      # tracking server: because artifact_location is a plain local path, the MLflow
      # client resolves it to a LocalArtifactRepository rather than proxying the download.
      # So mlruns must be visible to this container too, at the same absolute path.
      # Proxied serving (`--serve-artifacts` plus mlflow-artifacts:// URIs) would remove
      # this coupling, but requires re-logging the model.
      # Not :ro -- loading a registered model writes registered_model_meta back into the
      # artifact directory, so a read-only mount fails with EROFS at startup.
      - ./mlruns:${PWD}/mlruns
      # Prediction records survive container exit and are readable from the host by
      # Evidently and the Milestone 6 analysis notebook.
      - ./logs:/app/logs
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Per-track, not the shared MODEL_URI. model_uri_for() prefers MODEL_URI_<TRACK>, and
      # a shared MODEL_URI can only ever name one of the two registered models -- it would
      # silently become wrong the moment the fraud track is enabled here.
      MODEL_URI_CREDIT: models:/riskwatch_credit@production
    depends_on:
      mlflow:
        # Without this the API starts first, fails to reach the registry, and the
        # lifespan raises -- which is correct behaviour but looks like a broken image.
        condition: service_healthy

  # Where development happens. `make shell` drops you in here; the production Dockerfile's
  # dev stage supplies a Linux toolchain so the macOS/Linux split the docs keep warning
  # about (libomp vs libgomp) stops being something to remember.
  #
  # Behind a profile, so `docker compose up` still brings up exactly the five serving and
  # observability services and nothing else.
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    # Mounted at the host's own absolute path rather than a tidy /workspace. Two things
    # depend on it: MLflow records ABSOLUTE artifact locations in mlflow.db, so a model
    # trained on either side has to resolve on the other; and every module derives
    # PROJECT_ROOT from its own file location, so data/, logs/ and reports/ land where the
    # host expects them. Same reasoning as the mlruns mounts above.
    working_dir: ${PWD}
    volumes:
      - .:${PWD}
    environment:
      # The default is localhost:9091, which inside a container is the container itself.
      PUSHGATEWAY_URL: pushgateway:9091
    ports:
      # `docker compose run` does not publish these unless given --service-ports, so this
      # only binds when asked. It collides with the api service, so do not publish both.
      - "8000:8000"
    # Keeps the container alive for `docker compose up` and for VS Code's Dev Containers
    # extension, which starts the service and then execs into it. `make shell` overrides
    # this with bash.
    command: sleep infinity


  # Drift detection is a batch job -- it runs, computes and exits -- so Prometheus has no
  # long-lived target to scrape. The gateway holds the last pushed value between runs.
  pushgateway:
    image: prom/pushgateway:v1.11.3
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.3.1
    ports:
      - "3000:3000"
    environment:
      # Anonymous viewer access: this stack is local-only and it makes the dashboard one
      # click from a cold start. MUST NOT be carried into any publicly reachable deploy.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
